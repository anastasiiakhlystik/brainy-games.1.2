<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ігри: повторюємо А і О</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--ink:#2E2A40;--muted:#6f6886;--a:#fe9f4d;--a-soft:#f8d3af;--a-dark:#9b4a08;--o:#659df2;--o-soft:#c6dcff;--o-dark:#305bab;--ok:#2dc75c;--bad:#ff6464}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:'Nunito',system-ui,sans-serif;color:var(--ink);padding:16px 14px 40px;
       background:linear-gradient(180deg,#bfe6ff 0%,#e6f6ff 55%,#d9f5c8 100%);display:flex;flex-direction:column;align-items:center}
  h1{margin:6px 0 4px;font-size:clamp(28px,5vw,46px);font-weight:900;text-align:center}
  h1 .a{color:var(--a)} h1 .o{color:var(--o)}
  .sub{color:var(--muted);font-size:18px;text-align:center;margin-bottom:16px}
  .wrap{width:min(980px,100%)}
  .view{display:none}.view.show{display:block;animation:pop .25s}
  @keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
  .games{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
  .gcard{border:none;border-radius:28px;padding:26px 20px;cursor:pointer;font:inherit;color:var(--ink);text-align:center;box-shadow:0 7px 0 rgba(0,0,0,.12);transition:transform .12s}
  .gcard:hover{transform:translateY(-4px)}
  .gcard .ic{font-size:76px;line-height:1}.gcard .nm{font-size:28px;font-weight:900;margin-top:8px}.gcard .ds{font-size:16px;color:#5b5570;margin-top:6px}
  .bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap}
  .btn{border:none;border-radius:16px;padding:10px 18px;font:inherit;font-weight:900;font-size:18px;cursor:pointer;background:#fff;color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.12)}
  .btn.primary{background:var(--ink);color:#fff}
  .pill{background:#fff;border-radius:99px;padding:8px 16px;font-weight:900;font-size:18px;box-shadow:0 3px 0 rgba(0,0,0,.08)}
  .panel{background:rgba(255,255,255,.92);border-radius:28px;padding:18px;box-shadow:0 7px 0 rgba(0,0,0,.1)}
  .task{font-size:clamp(20px,3.2vw,28px);font-weight:900;text-align:center;margin:4px 0 6px}
  .hint{text-align:center;color:var(--muted);font-size:17px;margin-bottom:12px;min-height:24px}
  /* path */
  .maze{display:flex;align-items:center;justify-content:center;gap:10px}
  .side{display:flex;flex-direction:column;justify-content:space-between}
  .side div{font-size:clamp(34px,6vw,56px);display:flex;align-items:center;justify-content:center}
  .grid{display:grid;gap:8px}
  .cell{width:clamp(46px,9vw,86px);aspect-ratio:1;border-radius:16px;background:#fff;border:3px solid #e6e1ee;font-size:clamp(24px,4.5vw,44px);font-weight:900;
        display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;transition:transform .1s}
  .cell:hover{transform:scale(1.05)}
  .cell.stepA{background:var(--a);border-color:var(--a-dark);color:#1a1a1a}
  .cell.stepO{background:var(--o);border-color:var(--o-dark);color:#1a1a1a}
  .cell.next{box-shadow:0 0 0 4px #ffdc4a}
  .shake{animation:shake .35s}
  @keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  .cell.bad{background:#ffd6d6}
  .levels{display:flex;gap:8px;justify-content:center;margin-bottom:12px;flex-wrap:wrap}
  .levels .btn.on{background:var(--ink);color:#fff}
  /* balloons */
  .sky{position:relative;height:min(560px,70vh);border-radius:24px;overflow:hidden;background:linear-gradient(180deg,#9fd8ff,#e8f7ff);margin-top:6px}
  .cloud{position:absolute;font-size:60px;opacity:.85}
  .balloon{position:absolute;bottom:-190px;width:140px;display:flex;flex-direction:column;align-items:center;cursor:pointer;user-select:none;animation:rise linear forwards}
  @keyframes rise{to{transform:translateY(calc(-1 * (min(560px,70vh) + 220px)))}}
  .balloon .b{width:130px;height:150px;border-radius:50% 50% 46% 46%;display:flex;flex-direction:column;align-items:center;justify-content:center;
              box-shadow:inset -14px -14px 0 rgba(0,0,0,.08)}
  .balloon .b .em{font-size:52px;line-height:1}.balloon .b .w{font-size:17px;font-weight:900;margin-top:4px}
  .balloon .s{width:2px;height:40px;background:#777}
  .pop{animation:popb .3s forwards!important}
  @keyframes popb{to{transform:scale(1.6);opacity:0}}
  .float-msg{position:absolute;font-weight:900;font-size:22px;background:#fff;border-radius:12px;padding:4px 10px;pointer-events:none;animation:up 1.2s forwards}
  @keyframes up{to{transform:translateY(-60px);opacity:0}}
  .targetbtns{display:flex;gap:12px;justify-content:center}
  .targetbtns .btn{font-size:22px}
  .targetbtns .on.a{background:var(--a)}.targetbtns .on.o{background:var(--o)}
  /* result */
  .overlay{position:fixed;inset:0;background:rgba(46,42,64,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:5}
  .overlay.show{display:flex}
  .win{background:#fff;border-radius:28px;padding:26px 30px;text-align:center;max-width:420px;width:100%;animation:pop .3s}
  .win .stars{font-size:54px;letter-spacing:6px}.win h2{margin:4px 0;font-size:32px}.win p{color:var(--muted);font-size:18px;margin:6px 0 16px}
  .win .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .confetti{position:fixed;top:-20px;width:12px;height:18px;border-radius:3px;animation:fall linear forwards;pointer-events:none;z-index:9}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>
</head>
<body>
<h1>Повторюємо <span class="a">А</span> і <span class="o">О</span></h1>
<div class="sub">Літерка · Урок 1.2 · нові ігри</div>

<div class="wrap">
  <section class="view show" id="v-hub">
    <div class="games">
      <button class="gcard" style="background:#ffe1c7" data-go="path"><div class="ic">🛤️</div><div class="nm">Стежка додому</div><div class="ds">Допоможи Ані й Олегу дійти до будиночка по своїх літерах</div></button>
      <button class="gcard" style="background:#ffe6f2" data-go="balloons"><div class="ic">🎈</div><div class="nm">Лопни кульку</div><div class="ds">Лопай тільки кульки зі словами на потрібну літеру</div></button>
    </div>
  </section>

  <!-- PATH -->
  <section class="view" id="v-path">
    <div class="bar"><button class="btn" data-back>← Ігри</button><div class="pill" id="pathStat">Рівень 1 з 3</div></div>
    <div class="panel">
      <div class="levels" id="pathLevels"></div>
      <div class="task" id="pathTask"></div>
      <div class="hint" id="pathHint"></div>
      <div class="maze">
        <div class="side" id="sideL"></div>
        <div class="grid" id="grid"></div>
        <div class="side" id="sideR"></div>
      </div>
    </div>
  </section>

  <!-- BALLOONS -->
  <section class="view" id="v-balloons">
    <div class="bar"><button class="btn" data-back>← Ігри</button><div class="pill" id="balStat">Лопнуто: 0</div></div>
    <div class="panel">
      <div class="task" id="balTask">Які кульки лопаємо?</div>
      <div class="targetbtns">
        <button class="btn a" data-bt="А">🎈 Слова на А</button>
        <button class="btn o" data-bt="О">🎈 Слова на О</button>
      </div>
      <div class="sky" id="sky">
        <div class="cloud" style="left:6%;top:8%">☁️</div><div class="cloud" style="right:10%;top:22%">☁️</div><div class="cloud" style="left:40%;top:55%;font-size:44px">☁️</div>
      </div>
    </div>
  </section>
</div>

<div class="overlay" id="overlay">
  <div class="win">
    <div class="stars" id="winStars"></div>
    <h2 id="winTitle"></h2>
    <p id="winText"></p>
    <div class="btns"><button class="btn" id="winHub">← Інші ігри</button><button class="btn primary" id="winNext">Далі →</button></div>
  </div>
</div>

<script>
(function(){
  const $=id=>document.getElementById(id);
  let ctx=null,current='hub',onNext=null;
  function tone(fs,d){try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
    fs.forEach((f,k)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=f;
      const t=ctx.currentTime+k*d;g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d*1.6);o.start(t);o.stop(t+d*1.7)})}catch(e){}}
  const good=()=>tone([660,880],.09),bad=()=>tone([260,200],.14),fanfare=()=>tone([523,659,784,1046],.12),popS=()=>tone([900,1300],.05);
  const rnd=n=>Math.floor(Math.random()*n);
  function shuffle(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=rnd(k+1);[a[k],a[j]]=[a[j],a[k]]}return a}
  function go(v){current=v;document.querySelectorAll('.view').forEach(x=>x.classList.remove('show'));$('v-'+v).classList.add('show');
    stopBalloons();if(v==='path')startPath(0);if(v==='balloons')resetBalloons()}
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>go('hub'));
  function result(stars,title,text,nextLabel,next){$('winStars').textContent='⭐'.repeat(stars)+'☆'.repeat(3-stars);$('winTitle').textContent=title;$('winText').textContent=text;
    $('winNext').textContent=nextLabel;onNext=next;$('overlay').classList.add('show');fanfare();if(stars>=2)confetti()}
  $('winHub').onclick=()=>{$('overlay').classList.remove('show');go('hub')};
  $('winNext').onclick=()=>{$('overlay').classList.remove('show');onNext&&onNext()};
  function confetti(){const c=['#fe9f4d','#659df2','#2dc75c','#ffdc4a','#8f7fee'];for(let k=0;k<70;k++){const d=document.createElement('div');d.className='confetti';
    d.style.left=Math.random()*100+'vw';d.style.background=c[k%c.length];d.style.animationDuration=(2+Math.random()*2)+'s';d.style.animationDelay=Math.random()*.5+'s';
    document.body.appendChild(d);setTimeout(()=>d.remove(),5000)}}

  /* ---------- PATH ---------- */
  const LEVELS=[
    {n:5,who:'👧',name:'Аня',seq:['А'],task:'Допоможи Ані дійти додому! Йди тільки по літерах А',hint:'Натискай А по черзі, крок за кроком 👣'},
    {n:5,who:'👦',name:'Олег',seq:['О'],task:'Допоможи Олегу дійти додому! Йди тільки по літерах О',hint:'Натискай О по черзі, крок за кроком 👣'},
    {n:6,who:'👧👦',name:'Друзі',seq:['А','О'],task:'Аня й Олег ідуть разом: А, потім О, потім знову А…',hint:'Чергуй: а → о → а → о'}
  ];
  const OTHER=['М','К','С','Т','Н','Е','У','И'];
  let lvl=0,path=[],step=0,pathErr=0,totalErr=0,grid=[];
  function makePath(n){
    let r=rnd(n),p=[[r,0]];
    for(let c=0;c<n-1;c++){
      if(Math.random()<.65){let r2=rnd(n);const d=r2>r?1:-1;while(r!==r2){r+=d;p.push([r,c])}}
      p.push([r,c+1]);
    }
    return p;
  }
  function startPath(i){
    lvl=i;if(i===0)totalErr=0;pathErr=0;step=0;const L=LEVELS[i],n=L.n;
    $('pathStat').textContent='Рівень '+(i+1)+' з '+LEVELS.length;
    $('pathTask').textContent=L.task;$('pathHint').textContent=L.hint;
    $('pathLevels').innerHTML=LEVELS.map((x,k)=>'<button class="btn'+(k===i?' on':'')+'" data-l="'+k+'">'+x.who+' '+(k+1)+'</button>').join('');
    document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>startPath(+b.dataset.l));
    path=makePath(n);
    const onPath={};path.forEach(([r,c],k)=>onPath[r+','+c]=k);
    const g=$('grid');g.style.gridTemplateColumns='repeat('+n+',auto)';g.innerHTML='';grid=[];
    const fillers=L.seq.length>1?OTHER:OTHER.concat(L.seq[0]==='А'?['О','О','О']:['А','А','А']);
    for(let r=0;r<n;r++)for(let c=0;c<n;c++){
      const k=onPath[r+','+c];const d=document.createElement('div');d.className='cell';
      d.textContent= k!==undefined? L.seq[k%L.seq.length] : fillers[rnd(fillers.length)];
      d.onclick=()=>tapCell(r,c,d);g.appendChild(d);grid.push(d)}
    const sl=$('sideL'),sr=$('sideR');sl.innerHTML='';sr.innerHTML='';
    for(let r=0;r<n;r++){const a=document.createElement('div'),b=document.createElement('div');const h=grid[0].getBoundingClientRect().height||70;
      a.style.height=b.style.height=h+'px';a.textContent=r===path[0][0]?L.who:'';b.textContent=r===path[path.length-1][0]?'🏠':'';sl.appendChild(a);sr.appendChild(b)}
    sl.style.gap=sr.style.gap='8px';mark();
  }
  function mark(){grid.forEach(d=>d.classList.remove('next'))}
  function tapCell(r,c,d){
    const L=LEVELS[lvl],[pr,pc]=path[step];
    if(r===pr&&c===pc){
      d.classList.add(d.textContent==='А'?'stepA':'stepO');good();step++;
      if(step===path.length){totalErr+=pathErr;
        const s=pathErr<=1?3:pathErr<=3?2:1;
        const last=lvl===LEVELS.length-1;
        setTimeout(()=>result(s,L.name+' вдома! 🏠','Помилок: '+pathErr+(last?'. Усі рівні пройдено!':''),last?'↻ Ще раз':'Наступний рівень →',()=>startPath(last?0:lvl+1)),350)}
    }else{
      const n=L.n,idx=r*n+c;
      if(d.classList.contains('stepA')||d.classList.contains('stepO'))return;
      pathErr++;bad();d.classList.add('shake','bad');setTimeout(()=>d.classList.remove('shake','bad'),400);
      if(pathErr>=3){const nd=grid[pr*n+pc];nd.classList.add('next');$('pathHint').textContent='Підказка: наступний крок світиться жовтим ✨'}
    }
  }

  /* ---------- BALLOONS ---------- */
  const A=[['🍊','Апельсин'],['🍍','Ананас'],['🚌','Автобус'],['🦈','Акула'],['👩‍🚀','Астронавт'],['🚗','Авто']];
  const O=[['🥒','Огірок'],['🐑','Овечка'],['🦌','Олень'],['✏️','Олівець'],['👓','Окуляри'],['🍂','Осінь']];
  const X=[['🐱','Кіт'],['🌞','Сонце'],['🐟','Риба'],['🏠','Дім'],['🦊','Лисиця'],['🍋','Лимон']];
  const BCOL=['#ff8fa3','#ffd166','#8fd3ff','#b8f28f','#c9b6ff','#ffb38a'];
  let bt=null,spawnT=null,spawned=0,popped=0,missed=0,wrongB=0;const TOTAL=14;
  const sky=$('sky');
  document.querySelectorAll('[data-bt]').forEach(b=>b.onclick=()=>{bt=b.dataset.bt;document.querySelectorAll('[data-bt]').forEach(x=>x.classList.toggle('on',x===b));startBalloons()});
  function clearSky(){sky.querySelectorAll('.balloon,.float-msg').forEach(x=>x.remove())}
  function resetBalloons(){stopBalloons();bt=null;clearSky();document.querySelectorAll('[data-bt]').forEach(x=>x.classList.remove('on'));
    $('balTask').textContent='Які кульки лопаємо? Обери кнопку!';$('balStat').textContent='Лопнуто: 0'}
  function stopBalloons(){clearTimeout(spawnT);spawnT=null}
  function startBalloons(){stopBalloons();clearSky();spawned=0;popped=0;missed=0;wrongB=0;$('balStat').textContent='Лопнуто: 0';
    $('balTask').textContent='Лопай тільки слова на '+bt+'! 🎈';spawn()}
  function spawn(){
    if(spawned>=TOTAL){spawnT=setTimeout(endBalloons,6500);return}
    spawned++;
    const pool=Math.random()<.55?(bt==='А'?A:O):(Math.random()<.5?(bt==='А'?O:A):X);
    const [em,w]=pool[rnd(pool.length)];
    const b=document.createElement('div');b.className='balloon';
    const W=sky.clientWidth;b.style.left=(10+Math.random()*(W-160))+'px';b.style.animationDuration=(6+Math.random()*1.5)+'s';
    b.innerHTML='<div class="b" style="background:'+BCOL[rnd(BCOL.length)]+'"><div class="em">'+em+'</div><div class="w">'+w+'</div></div><div class="s"></div>';
    b.dataset.ok=w[0]===bt?'1':'0';
    b.onclick=e=>{if(b.dataset.done)return;b.dataset.done='1';const rect=sky.getBoundingClientRect(),br=b.getBoundingClientRect();
      if(b.dataset.ok==='1'){popped++;popS();msg('+1 ⭐',br.left-rect.left+20,br.top-rect.top);b.style.transform=getComputedStyle(b).transform;b.style.animation='none';b.dataset.popped='1';b.querySelector('.b').classList.add('pop');b.querySelector('.s').style.opacity=0;setTimeout(()=>b.remove(),300)}
      else{wrongB++;bad();msg(w+' на '+w[0]+'!',br.left-rect.left,br.top-rect.top);const inner=b.querySelector('.b');inner.classList.add('shake');setTimeout(()=>inner.classList.remove('shake'),400);b.dataset.done=''}
      $('balStat').textContent='Лопнуто: '+popped};
    b.addEventListener('animationend',ev=>{if(ev.animationName==='rise'){if(b.dataset.ok==='1'&&!b.dataset.popped)missed++;b.remove()}});
    sky.appendChild(b);spawnT=setTimeout(spawn,1700);
  }
  function msg(t,x,y){const m=document.createElement('div');m.className='float-msg';m.textContent=t;m.style.left=Math.max(0,x)+'px';m.style.top=Math.max(0,y)+'px';sky.appendChild(m);setTimeout(()=>m.remove(),1200)}
  function endBalloons(){stopBalloons();const s=(wrongB<=1&&missed<=1)?3:(wrongB+missed<=4)?2:1;
    result(s,s===3?'Майстер кульок! 🎈':'Молодець!','Лопнуто '+popped+' кульок зі словами на '+bt+'. Помилок: '+wrongB+'.','↻ Ще раз',()=>startBalloons())}
})();
</script>
</body>
</html>
